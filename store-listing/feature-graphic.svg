<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#121A2E"/>
    </linearGradient>
    <linearGradient id="ballFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#9FE800"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#CCFF00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- faint brand grid, matches in-app DotGrid texture -->
  <g stroke="#CCFF00" stroke-opacity="0.05" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="500"/>
    <line x1="260" y1="0" x2="260" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="540" y1="0" x2="540" y2="500"/>
    <line x1="0" y1="90" x2="1024" y2="90"/>
    <line x1="0" y1="220" x2="1024" y2="220"/>
    <line x1="0" y1="350" x2="1024" y2="350"/>
    <line x1="0" y1="450" x2="1024" y2="450"/>
  </g>

  <circle cx="800" cy="250" r="230" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="72" y="230" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="92" fill="#E2E8F0">Sports<tspan fill="#CCFF00">Fund</tspan></text>
  <rect x="74" y="252" width="230" height="6" rx="3" fill="#CCFF00"/>
  <text x="72" y="305" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="30" fill="#94A3B8">Find courts. Split costs. Play more.</text>

  <!-- pill badges echoing in-app categories -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="74" y="340" width="118" height="40" rx="20" fill="rgba(204,255,0,0.08)" stroke="#CCFF00" stroke-opacity="0.35"/>
    <text x="100" y="366" fill="#CCFF00">Book</text>
    <rect x="200" y="340" width="140" height="40" rx="20" fill="rgba(148,163,184,0.08)" stroke="#94A3B8" stroke-opacity="0.35"/>
    <text x="222" y="366" fill="#E2E8F0">Split Cost</text>
    <rect x="348" y="340" width="120" height="40" rx="20" fill="rgba(148,163,184,0.08)" stroke="#94A3B8" stroke-opacity="0.35"/>
    <text x="370" y="366" fill="#E2E8F0">Track</text>
  </g>
</svg>
